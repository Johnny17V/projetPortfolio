<div class="student-info glass-dark m-2">
    <a href="{% url 'portfolio' pk=profile.id %}">
        <h5 class="fw-bold mb-1 text-white">
            {% if profile.first_name %}{{ profile.first_name }} {{ profile.last_name }}{% else %}{{
            profile.username }}{% endif %}
        </h5>
        <p class="text-uppercase text-white-50 mb-0 text-truncate" style="font-size: 0.75rem; letter-spacing: 2px;">
            {{ profile.bio|default:"IT Student" }}
        </p>
    </a>
</div>
