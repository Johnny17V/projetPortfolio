{% load static %}

<div class="carousel-wrapper px-3 mt-4 mb-5">
    
    <button class="carousel-btn left glass js-scroll-left">
        <i class="bi bi-chevron-left fs-4"></i>
    </button>

    <div class="carousel-scroll js-carousel-container">
        
        {% for projet in projets %}
        <div class="carousel-slide">
            <article class="card">
                <figure>
                    <picture>
                        {% if projet.image %}
                        <img src="{{ projet.image.url }}" alt="{{ projet.titre }}" />
                        {% else %}
                        <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?q=80&w=800&auto=format&fit=crop" alt="Default" />
                        {% endif %}
                    </picture>
                    <figcaption>
                        <h5>{{ projet.titre|default:"Mon Projet" }}</h5>
                        <p>{{ projet.description|truncatewords:15 }}</p>
                        <a href="#" class="text-gold text-decoration-none fw-bold mt-2">Check it out <i class="bi bi-arrow-right"></i></a>
                    </figcaption>
                </figure>
            </article>
        </div>
        {% empty %}
        <p class="text-white-50 text-center w-100">Aucun projet à afficher.</p>
        {% endfor %}

    </div>

    <button class="carousel-btn right glass js-scroll-right">
        <i class="bi bi-chevron-right fs-4"></i>
    </button>
</div>
