{% load static %}
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}J17V - IT Talent Showcase{% endblock %}</title>

    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    {% block extra_css %}{% endblock %}

    <style>
        /* Toutes tes règles CSS globales restent ici */
        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            background-color: var(--color-j17v-dark);
            color: white;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
        }

        main {
            flex: 1;
        }

        :root {
            --color-j17v-gold: #c5a073;
            --color-j17v-dark: #0a0a0a;
        }

        .lead {
            font-family: 'Pacifico';
            font-size: 55px;
            text-transform: uppercase;
        }

        .second-lead {
            font-size: larger;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            text-transform: uppercase;
        }

        .second-lead span {
            color: rgb(169, 146, 125);
        }

        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 30;
            cursor: pointer;
            transition: background-color 0.3s;
            color: white;
            padding: 0;
        }

        .carousel-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .carousel-btn.left {
            left: -20px;
        }

        .carousel-btn.right {
            right: -20px;
        }

        @media (max-width: 768px) {
            .carousel-btn {
                display: none;
            }
        }

        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-dark {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .text-gold {
            color: var(--color-j17v-gold);
        }

        .bg-gold {
            background-color: var(--color-j17v-gold);
        }

        .bg-glow-1 {
            position: fixed;
            top: -10%;
            left: -10%;
            width: 40%;
            height: 40%;
            background: rgba(197, 160, 115, 0.1);
            filter: blur(120px);
            border-radius: 50%;
            z-index: -1;
        }

        nav {
            background-color: rgba(197, 160, 115, 0.8);
            filter: blur(0.1px);
        }

        .bg-glow-2 {
            position: fixed;
            bottom: -10%;
            right: -10%;
            width: 40%;
            height: 40%;
            background: rgba(197, 160, 115, 0.05);
            filter: blur(120px);
            border-radius: 50%;
            z-index: -1;
        }

        .student-scroll {
            display: flex;
            gap: 1.5rem;
            overflow-x: auto;
            padding-bottom: 2rem;
            scrollbar-width: none;
        }

        .student-scroll::-webkit-scrollbar {
            display: none;
        }

        .student-card {
            min-width: 280px;
            height: 380px;
            border-radius: 32px;
            overflow: hidden;
            position: relative;
            transition: transform 0.3s, opacity 0.3s;
            opacity: 0.8;
        }

        .student-card:hover {
            opacity: 1;
            transform: scale(1.02);
        }

        .student-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .student-info {
            position: absolute;
            bottom: 15px;
            left: 15px;
            right: 15px;
            border-radius: 24px;
            padding: 15px;
            cursor: pointer;
        }

        .project-card {
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .project-card:hover {
            transform: translateY(-10px);
        }

        .project-img-wrapper {
            aspect-ratio: 4/3;
            border-radius: 24px;
            overflow: hidden;
            position: relative;
        }

        .project-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .project-card:hover .project-img-wrapper img {
            transform: scale(1.1);
        }
    </style>
</head>

<body>
    {% include "../fragments/header.html" %}

    {% block content %}
    {% endblock %}

    {% include "../fragments/footer.html" %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://kit.fontawesome.com/86289f33ef.js" crossorigin="anonymous"></script>

    {% block extra_js %}{% endblock %}
</body>

</html>
